<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Fisioterapeuta | Kinerva</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal: #00BDB4;
      --teal-dark: #009990;
      --dark: #1a2533;
      --gray: #6b7280;
      --light: #f4f6f8;
      --border: #e5e7eb;
      --red: #dc3545;
      --green: #198754;
    }

    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--light); color: var(--dark); min-height: 100vh; }

    /* ── Login ── */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f1f35 0%, #1a3a5c 50%, #00BDB4 100%);
      padding: 24px;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo .brand-icon {
      width: 56px; height: 56px;
      background: var(--teal);
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 26px; color: #fff; margin-bottom: 12px;
    }
    .login-logo h1 { font-size: 20px; font-weight: 700; color: var(--dark); }
    .login-logo p  { font-size: 13px; color: var(--gray); margin-top: 4px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--gray); margin-bottom: 6px; letter-spacing: .4px; text-transform: uppercase; }
    .form-input {
      width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 14px; color: var(--dark);
      outline: none; transition: border-color .2s;
    }
    .form-input:focus { border-color: var(--teal); }

    .input-wrap { position: relative; }
    .input-wrap .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--gray); cursor: pointer; padding: 4px;
    }

    .remember-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
    }
    .remember-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--teal); }
    .remember-row label { font-size: 13px; color: var(--gray); cursor: pointer; }

    .btn-login {
      width: 100%; padding: 12px; background: var(--teal); color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .btn-login:hover { background: var(--teal-dark); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    .login-error {
      background: #fff5f5; border: 1px solid #fca5a5; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; color: var(--red);
      margin-bottom: 16px; display: none;
    }
    .login-lockout {
      background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; color: #92400e;
      margin-bottom: 16px; display: none;
    }

    /* ── App shell ── */
    #appShell { display: none; min-height: 100vh; flex-direction: column; }

    .topbar {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .topbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: var(--dark); }
    .topbar-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar-name { font-size: 13px; color: var(--gray); }
    .btn-logout {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 12px; font-size: 12px; color: var(--gray); cursor: pointer;
      transition: all .2s;
    }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    .page-content { max-width: 820px; margin: 0 auto; padding: 32px 20px; }

    /* ── Profile card ── */
    .profile-header {
      background: #fff; border-radius: 14px; padding: 28px 32px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 20px;
      display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    }
    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar-img {
      width: 88px; height: 88px; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--teal); display: block;
    }
    .avatar-placeholder {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--teal); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; border: 3px solid var(--teal);
    }
    .avatar-upload-btn {
      position: absolute; bottom: 2px; right: 2px;
      background: var(--teal); color: #fff; border: none;
      width: 26px; height: 26px; border-radius: 50%;
      font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    .profile-meta h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .profile-meta .specialty { font-size: 13px; color: var(--teal); font-weight: 600; }
    .profile-meta .username  { font-size: 13px; color: var(--gray); margin-top: 2px; }

    /* ── Cards ── */
    .card {
      background: #fff; border-radius: 14px; padding: 24px 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 20px;
    }
    .card-title {
      font-size: 14px; font-weight: 700; color: var(--dark);
      margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
    }
    .card-title i { color: var(--teal); }

    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 580px) { .field-grid { grid-template-columns: 1fr; } }

    .field-full { grid-column: 1 / -1; }

    .field label { display: block; font-size: 11px; font-weight: 600; color: var(--gray); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 9px 13px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 13px; font-family: inherit;
      color: var(--dark); outline: none; transition: border-color .2s;
    }
    .field input:focus, .field textarea:focus { border-color: var(--teal); }
    .field textarea { resize: vertical; min-height: 80px; }

    .pass-req { font-size: 11px; color: var(--gray); margin-top: 6px; line-height: 1.6; }
    .pass-req.has-error { color: var(--red); }

    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-save {
      background: var(--teal); color: #fff; border: none;
      border-radius: 8px; padding: 10px 24px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .btn-save:hover { background: var(--teal-dark); }
    .btn-save:disabled { opacity: .6; cursor: not-allowed; }

    .alert { border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
    .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .alert-danger  { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

    /* ── Toast ── */
    .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 8px; }
    .toast-msg {
      padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,.15); animation: slideUp .3s ease;
      white-space: nowrap;
    }
    .toast-success { background: var(--teal); color: #fff; }
    .toast-error   { background: var(--red);  color: #fff; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="brand-icon"><i class="fas fa-heartbeat"></i></div>
      <h1>Kinerva Fisioterapia</h1>
      <p>Portal Fisioterapeuta</p>
    </div>

    <div class="login-error"  id="loginError"></div>
    <div class="login-lockout" id="loginLockout"><i class="fas fa-lock me-1"></i> <span id="lockoutMsg"></span></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginUser">Usuario</label>
        <input id="loginUser" class="form-input" type="text" autocomplete="username"
               placeholder="tu.usuario" maxlength="60" required>
      </div>
      <div class="form-group">
        <label for="loginPass">Contraseña</label>
        <div class="input-wrap">
          <input id="loginPass" class="form-input" type="password" autocomplete="current-password"
                 placeholder="••••••••" maxlength="128" required style="padding-right:42px">
          <button type="button" class="toggle-pass" onclick="togglePass('loginPass', this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Mantener sesión iniciada (7 días)</label>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <i class="fas fa-sign-in-alt me-1"></i>Iniciar sesión
      </button>
    </form>
  </div>
</div>

<!-- ── App shell ── -->
<div id="appShell">
  <header class="topbar">
    <div class="topbar-brand">
      <div class="dot"></div>
      Kinerva &mdash; Fisioterapeuta
    </div>
    <div class="topbar-right">
      <span class="topbar-name" id="topbarName"></span>
      <button class="btn-logout" onclick="logout()">
        <i class="fas fa-sign-out-alt me-1"></i>Salir
      </button>
    </div>
  </header>

  <main class="page-content" id="pageContent">
    <div style="text-align:center;padding:60px 0;color:#aaa">
      <i class="fas fa-circle-notch fa-spin fa-2x"></i>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>
<input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" style="display:none">

<script>
  const API = '/api';
  let TOKEN = null;
  let USER  = null;

  /* ── Helpers ── */
  function esc(v) {
    return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function initials(name) {
    return (name || '?').split(' ').slice(0,2).map(w => w[0]?.toUpperCase() || '').join('');
  }

  function toast(msg, type = 'success') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast-msg toast-${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  function togglePass(inputId, btn) {
    const inp = document.getElementById(inputId);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.innerHTML = `<i class="fas fa-eye${show ? '-slash' : ''}"></i>`;
  }

  async function apiFetch(method, path, body, useTherapistToken = true) {
    const headers = { 'Content-Type': 'application/json' };
    if (useTherapistToken && TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;
    const r = await fetch(API + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
    });
    return r.json();
  }

  /* ── Auth ── */
  function logout() {
    TOKEN = null; USER = null;
    localStorage.removeItem('k_fisio_token');
    localStorage.removeItem('k_fisio_user');
    document.getElementById('appShell').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginForm').reset();
  }

  function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'flex';
    document.getElementById('topbarName').textContent = USER.name || USER.username;
    renderProfile();
  }

  /* ── Login ── */
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn      = document.getElementById('loginBtn');
    const errEl    = document.getElementById('loginError');
    const lockEl   = document.getElementById('loginLockout');
    const lockMsg  = document.getElementById('lockoutMsg');
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    const rememberMe = document.getElementById('rememberMe').checked;

    errEl.style.display = 'none';
    lockEl.style.display = 'none';

    if (!username || !password) {
      errEl.textContent = 'Completa todos los campos.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin me-1"></i>Verificando…';

    try {
      const data = await apiFetch('POST', '/auth/therapist-login', { username, password, rememberMe }, false);

      if (data?.success) {
        TOKEN = data.token;
        USER  = data.user;
        localStorage.setItem('k_fisio_token', TOKEN);
        localStorage.setItem('k_fisio_user', JSON.stringify(USER));
        showApp();
      } else {
        if (data?.error?.includes('bloqueada') || data?.error?.includes('intentos')) {
          lockMsg.textContent = data.error;
          lockEl.style.display = 'block';
        } else {
          errEl.textContent = data?.error || 'Credenciales incorrectas.';
          errEl.style.display = 'block';
        }
      }
    } catch {
      errEl.textContent = 'Error de conexión. Intenta de nuevo.';
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i>Iniciar sesión';
    }
  });

  /* ── Profile ── */
  function avatarHtml(user) {
    return user.photo_path
      ? `<img src="${esc(user.photo_path)}?t=${Date.now()}" class="avatar-img" alt="Foto de perfil">`
      : `<div class="avatar-placeholder">${initials(user.name)}</div>`;
  }

  async function renderProfile() {
    const el = document.getElementById('pageContent');
    el.innerHTML = '<div style="text-align:center;padding:60px 0;color:#aaa"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>';

    const data = await apiFetch('GET', '/therapist/me');
    if (!data?.success) { toast('Error al cargar perfil', 'error'); return; }
    const u = data.user;
    USER = { ...USER, ...u };
    localStorage.setItem('k_fisio_user', JSON.stringify(USER));
    document.getElementById('topbarName').textContent = u.name || u.username;

    el.innerHTML = `
      <!-- Header con foto -->
      <div class="profile-header">
        <div class="avatar-wrap" id="avatarWrap">
          ${avatarHtml(u)}
          <button class="avatar-upload-btn" onclick="document.getElementById('photoInput').click()" title="Cambiar foto">
            <i class="fas fa-camera"></i>
          </button>
        </div>
        <div class="profile-meta">
          <h2>${esc(u.name)}</h2>
          ${u.specialty ? `<div class="specialty">${esc(u.specialty)}</div>` : ''}
          <div class="username">@${esc(u.username)}</div>
        </div>
      </div>

      <!-- Datos del perfil -->
      <div class="card">
        <div class="card-title"><i class="fas fa-user-edit"></i> Información de perfil</div>
        <div id="profileAlert"></div>
        <form id="profileForm">
          <div class="field-grid">
            <div class="field field-full">
              <label>Nombre completo</label>
              <input type="text" name="name" value="${esc(u.name)}" maxlength="150" required>
            </div>
            <div class="field">
              <label>Correo electrónico</label>
              <input type="email" name="email" value="${esc(u.email || '')}" maxlength="120">
            </div>
            <div class="field">
              <label>Teléfono</label>
              <input type="tel" name="phone" value="${esc(u.phone || '')}" maxlength="30">
            </div>
            <div class="field field-full">
              <label>Especialidad</label>
              <input type="text" name="specialty" value="${esc(u.specialty || '')}" maxlength="120"
                     placeholder="Ej. Fisioterapia deportiva, Neurológica…">
            </div>
            <div class="field field-full">
              <label>Acerca de ti / Biografía</label>
              <textarea name="bio" maxlength="1000" rows="4"
                placeholder="Describe tu experiencia, certificaciones, enfoque de tratamiento…">${esc(u.bio || '')}</textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-save" id="profileSaveBtn">
              <i class="fas fa-save me-1"></i>Guardar cambios
            </button>
          </div>
        </form>
      </div>

      <!-- Cambiar contraseña -->
      <div class="card">
        <div class="card-title"><i class="fas fa-lock"></i> Cambiar contraseña</div>
        <div id="passAlert"></div>
        <form id="passForm">
          <div class="field-grid">
            <div class="field field-full">
              <label>Contraseña actual</label>
              <div class="input-wrap">
                <input type="password" name="currentPassword" class="form-input" style="border:1.5px solid #e5e7eb;border-radius:8px;padding:9px 42px 9px 13px" maxlength="128" autocomplete="current-password">
                <button type="button" class="toggle-pass" onclick="togglePass(this.previousElementSibling.id||'cp0', this)"
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#6b7280;cursor:pointer"
                  onmousedown="this.previousElementSibling.id='cp0'">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>
            <div class="field">
              <label>Nueva contraseña</label>
              <div class="input-wrap" style="position:relative">
                <input type="password" name="newPassword" id="newPassInput" style="width:100%;padding:9px 42px 9px 13px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px;color:#1a2533;outline:none" maxlength="128" autocomplete="new-password" oninput="checkPassStrength(this.value)">
                <button type="button" onclick="togglePassEl(document.getElementById('newPassInput'), this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#6b7280;cursor:pointer">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="pass-req" id="passReq">Mín. 8 caracteres · 1 mayúscula · 1 número · 1 especial</div>
            </div>
            <div class="field">
              <label>Confirmar nueva contraseña</label>
              <input type="password" name="confirmPassword" style="width:100%;padding:9px 13px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px;color:#1a2533;outline:none" maxlength="128" autocomplete="new-password">
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-save" id="passSaveBtn">
              <i class="fas fa-key me-1"></i>Actualizar contraseña
            </button>
          </div>
        </form>
      </div>`;

    // Guardar perfil
    document.getElementById('profileForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn   = document.getElementById('profileSaveBtn');
      const alert = document.getElementById('profileAlert');
      const fd    = new FormData(e.target);
      alert.innerHTML = '';
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-circle-notch fa-spin me-1"></i>Guardando…';
      const res = await apiFetch('PUT', '/therapist/me', {
        name:      fd.get('name'),
        email:     fd.get('email'),
        phone:     fd.get('phone'),
        specialty: fd.get('specialty'),
        bio:       fd.get('bio'),
      });
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-save me-1"></i>Guardar cambios';
      if (res?.success) {
        USER = { ...USER, ...res.user };
        localStorage.setItem('k_fisio_user', JSON.stringify(USER));
        document.getElementById('topbarName').textContent = res.user.name;
        toast('Perfil actualizado correctamente');
      } else {
        alert.innerHTML = `<div class="alert alert-danger">${esc(res?.error || 'Error al guardar')}</div>`;
      }
    });

    // Cambiar contraseña
    document.getElementById('passForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn   = document.getElementById('passSaveBtn');
      const alert = document.getElementById('passAlert');
      const fd    = new FormData(e.target);
      const np    = fd.get('newPassword');
      const cp2   = fd.get('confirmPassword');
      alert.innerHTML = '';
      if (!fd.get('currentPassword') || !np) {
        alert.innerHTML = '<div class="alert alert-danger">Completa todos los campos de contraseña.</div>';
        return;
      }
      if (np !== cp2) {
        alert.innerHTML = '<div class="alert alert-danger">Las contraseñas nuevas no coinciden.</div>';
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-circle-notch fa-spin me-1"></i>Actualizando…';
      const res = await apiFetch('PUT', '/therapist/me', {
        name:            USER.name,
        currentPassword: fd.get('currentPassword'),
        newPassword:     np,
      });
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-key me-1"></i>Actualizar contraseña';
      if (res?.success) {
        e.target.reset();
        document.getElementById('passReq').textContent = 'Mín. 8 caracteres · 1 mayúscula · 1 número · 1 especial';
        document.getElementById('passReq').className = 'pass-req';
        toast('Contraseña actualizada correctamente');
      } else {
        alert.innerHTML = `<div class="alert alert-danger">${esc(res?.error || 'Error al actualizar')}</div>`;
      }
    });
  }

  /* ── Password strength indicator ── */
  function checkPassStrength(val) {
    const el = document.getElementById('passReq');
    if (!val) { el.textContent = 'Mín. 8 caracteres · 1 mayúscula · 1 número · 1 especial'; el.className = 'pass-req'; return; }
    const ok = val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val);
    const issues = [];
    if (val.length < 8)           issues.push('Mín. 8 caracteres');
    if (!/[A-Z]/.test(val))       issues.push('1 mayúscula');
    if (!/[0-9]/.test(val))       issues.push('1 número');
    if (!/[^A-Za-z0-9]/.test(val)) issues.push('1 carácter especial');
    el.textContent = ok ? '✓ Contraseña segura' : 'Falta: ' + issues.join(' · ');
    el.className = 'pass-req' + (ok ? '' : ' has-error');
  }

  function togglePassEl(inp, btn) {
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.innerHTML = `<i class="fas fa-eye${show ? '-slash' : ''}"></i>`;
  }

  /* ── Photo upload ── */
  document.getElementById('photoInput').addEventListener('change', async function() {
    const file = this.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { toast('La imagen no puede superar 2 MB', 'error'); return; }

    const reader = new FileReader();
    reader.onload = async e => {
      const res = await apiFetch('POST', '/therapist/photo', { image: e.target.result });
      if (res?.success) {
        USER.photo_path = res.photo_path;
        localStorage.setItem('k_fisio_user', JSON.stringify(USER));
        const wrap = document.getElementById('avatarWrap');
        if (wrap) {
          const btn = wrap.querySelector('.avatar-upload-btn');
          wrap.innerHTML = `<img src="${esc(res.photo_path)}?t=${Date.now()}" class="avatar-img" alt="Foto">`;
          wrap.appendChild(btn);
        }
        toast('Foto actualizada');
      } else {
        toast(res?.error || 'Error al subir foto', 'error');
      }
    };
    reader.readAsDataURL(file);
    this.value = '';
  });

  /* ── Init ── */
  function init() {
    TOKEN = localStorage.getItem('k_fisio_token');
    const raw = localStorage.getItem('k_fisio_user');
    if (TOKEN && raw) {
      try {
        const payload = JSON.parse(atob(TOKEN.split('.')[1]));
        if (payload.exp * 1000 > Date.now()) {
          USER = JSON.parse(raw);
          showApp();
          return;
        }
      } catch { /* token inválido */ }
    }
    localStorage.removeItem('k_fisio_token');
    localStorage.removeItem('k_fisio_user');
    window.location.replace('/portal');
  }

  init();
</script>
</body>
</html>
